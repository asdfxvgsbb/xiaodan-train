name: data-prep-vocab

on:
  workflow_dispatch:
    inputs:
      sample_mb:
        description: '采样MB数(默认300)'
        required: false
        default: '300'
        type: string

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: pip install -q huggingface_hub
      - name: build-vocab
        env:
          XDAN_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ENDPOINT: https://huggingface.co
          SAMPLE_MB: "${{ github.event.inputs.sample_mb || '300' }}"
        run: |
          python - <<'PY'
          import os, json, random
          from collections import Counter
          from huggingface_hub import hf_hub_download, HfApi

          TOKEN = os.environ["XDAN_TOKEN"]
          EP = os.environ["HF_ENDPOINT"]
          SAMPLE_MB = int(os.environ.get("SAMPLE_MB", "300"))

          print("[1/3] 下载 corpus_skypile.txt (3.7GB) ...")
          p = hf_hub_download("jinax/xiaodan-135m", "corpus_skypile.txt",
                               repo_type="model", token=TOKEN, endpoint=EP)
          total_mb = os.path.getsize(p) / 1048576
          print("  文件 %.0f MB" % total_mb)

          # 采样策略：每 1MB 块以 (SAMPLE_MB/total_mb) 概率计入 Counter
          keep_prob = min(1.0, SAMPLE_MB / total_mb)
          print("[2/3] 流式采样计数 (采样率 %.1f%%) ..." % (keep_prob*100))
          cnt = Counter()
          random.seed(42)
          read_mb = 0
          with open(p, encoding="utf-8", errors="ignore") as f:
              while True:
                  chunk = f.read(1 << 20)
                  if not chunk:
                      break
                  read_mb += 1
                  if random.random() < keep_prob:
                      cnt.update(chunk)
          print("  已读 %.0f MB, 采样字符集大小: %d" % (read_mb, len(cnt)))

          # 保留出现>=3次；若字符集过大，截取高频前 12000（不含<unk>）
          chars = [c for c, n in cnt.most_common() if n >= 3]
          if len(chars) > 12000:
              chars = chars[:12000]
          chars = ['<unk>'] + sorted(chars)
          print("  词表大小(含<unk>):", len(chars))
          print("  前20字符:", chars[1:21])

          # 写临时文件（atomically）
          tmp = "/tmp/vocab_skypile.json"
          with open(tmp, "w", encoding="utf-8") as f:
              json.dump(chars, f, ensure_ascii=False)

          # 采样裁剪一份训练子集（约 400MB）—— 2 万步只需 ~82M 字符
          train_mb = int(os.environ.get("TRAIN_MB", "400"))
          train_path = "/tmp/corpus_skypile_train.txt"
          print("[2.5] 采样裁剪训练子集 %.0f MB ..." % (train_mb))
          import sys as _sys
          # 逐行采样：按 train_mb/total_mb 概率保留整行（保持语料结构）
          line_keep = min(1.0, train_mb / total_mb)
          out_mb = 0
          with open(p, encoding="utf-8", errors="ignore") as fin, \
               open(train_path, "w", encoding="utf-8") as fout:
              for line in fin:
                  if random.random() < line_keep:
                      fout.write(line)
                      out_mb += len(line.encode("utf-8")) / 1048576
                      if out_mb >= train_mb * 1.5:
                          break
          print("  训练子集: %.0f MB" % (out_mb))

          print("[3/3] 上传到 jinax/xiaodan-135m ...")
          api = HfApi(token=TOKEN, endpoint=EP)
          api.upload_file(path_or_fileobj=tmp, path_in_repo="vocab_skypile.json",
                          repo_id="jinax/xiaodan-135m", repo_type="model",
                          commit_message="build vocab from skypile sample %dMB" % SAMPLE_MB)
          api.upload_file(path_or_fileobj=train_path, path_in_repo="corpus_skypile_train.txt",
                          repo_id="jinax/xiaodan-135m", repo_type="model",
                          commit_message="train subset %.0fMB" % out_mb)
          print("完成! vocab_skypile.json + corpus_skypile_train.txt 已上传")
          PY