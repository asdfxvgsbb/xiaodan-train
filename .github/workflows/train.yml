name: xiaodan-train

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install
        run: pip install -q huggingface_hub numpy

      - name: train
        env:
          XDAN_TOKEN: ${{ secrets.HF_TOKEN }}
          XDAN_GH_TOKEN: ${{ secrets.GH_TOKEN }}
          HF_ENDPOINT: https://huggingface.co
          XDAN_DIR: ${{ github.workspace }}/xd
          XDAN_STEPS: "200000"
          XDAN_BUDGET: "18000"
          XDAN_THREADS: "2"
          XDAN_B: "12"
          XDAN_LR: "0.003"
          XDAN_UPLOAD_EVERY: "500"
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          p = hf_hub_download(
              "jinax/xiaodan-v9", "cloud_run.py",
              repo_type="model",
              token=os.environ["XDAN_TOKEN"],
              endpoint=os.environ["HF_ENDPOINT"])
          print("cloud_run.py ->", p)
          exec(open(p, encoding="utf-8").read())
          run()
          PY
